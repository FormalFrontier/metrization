name = "metrization"
version = "0.1.0"
lintDriver = "batteries/runLinter"
defaultTargets = ["Metrization", "MetrizationTest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[lean_lib]]
name = "Metrization"
globs = [
  "Metrization",
  "Metrization.Finsupp",
  "Metrization.RegularBasis",
  "Metrization.LocallyFinite",
]

[[lean_lib]]
name = "MetrizationTest"
globs = [
  "MetrizationTest",
  "MetrizationTest.LocallyFinite",
]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"
